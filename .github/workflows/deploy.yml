name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# deploy-pages 透過 OIDC 取得部署權杖，pages + id-token 缺一不可
permissions:
  contents: read
  pages: write
  id-token: write

# 連續 push 時排隊而非互相取消，避免部署中途被砍
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
